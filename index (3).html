<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>끝말잇기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #ffffff;
    --bg-1: #f6f2fc;
    --bg-2: #ece3f9;
    --ink: #241f38;
    --ink-dim: #756e91;
    --ink-faint: #b0a9c8;
    --violet: #8b7cf5;
    --violet-deep: #6a5ce0;
    --pink: #e18fd9;
    --card: #ffffff;
    --card-border: rgba(139,124,246,0.14);
    --card-shadow: 0 14px 32px -16px rgba(107,91,220,0.28);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  * { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; background: var(--bg-1); }
  body {
    font-family: 'Gothic A1', -apple-system, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    width: 100%;
    max-width: 460px;
    min-height: 100%;
    background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    overflow: hidden;
  }

  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 4px;
    flex-shrink: 0;
    min-height: 44px;
  }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: rgba(139,124,246,0.08); color: var(--violet-deep); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.ghost { visibility: hidden; }

  .brand {
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 900;
    font-size: 17px;
    letter-spacing: -0.01em;
  }
  .brand .b1 { background: linear-gradient(120deg, var(--violet-deep), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand .b2 { background: linear-gradient(120deg, var(--violet), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 22px 112px;
    -webkit-overflow-scrolling: touch;
  }
  main::-webkit-scrollbar { width: 0; }

  .screen { display: none; animation: rise 0.35s ease; }
  .screen.active { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- Home ---------- */
  .logo-lockup { text-align: center; margin-top: 6vh; }
  .logo-lockup .brand { justify-content: center; font-size: 34px; }
  .logo-lockup .knot { display: block; margin: 2px auto 0; width: 46px; height: 20px; opacity: 0.9; }

  .home-copy {
    margin-top: 18px;
    text-align: center;
    font-size: 19px;
    line-height: 1.6;
    color: var(--ink);
    font-weight: 700;
  }
  .home-copy .hl {
    background: linear-gradient(120deg, var(--violet-deep), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .hero-wrap { margin: 34px 0 6px; display: flex; justify-content: center; }


  .hero-img { display: block; width: 88%; max-width: 340px; height: auto; }
  .top-logo { display: block; height: 28px; width: auto; flex-shrink: 0; user-select: none; -webkit-user-drag: none; }


  .home-visual-wrap { display: flex; justify-content: center; margin: 0 -12px; }
  .home-visual { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 300px); min-height: 300px; object-fit: contain; }
  .top-logo.hidden { visibility: hidden; }

  .home-cta { margin-top: 26px; text-align: center; }

  /* ---------- Buttons ---------- */
  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 16px 20px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    background: linear-gradient(120deg, var(--violet-deep), var(--pink));
    cursor: pointer;
    box-shadow: 0 14px 28px -12px rgba(107,91,220,0.55);
    transition: transform 0.15s ease;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-ghost {
    display: block;
    width: 100%;
    border: 1.5px solid rgba(139,124,246,0.25);
    border-radius: 18px;
    padding: 15px 20px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--violet-deep);
    background: #ffffff;
    cursor: pointer;
    box-shadow: var(--card-shadow);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .btn-ghost:hover { border-color: var(--violet); }

  /* ---------- Situation list ---------- */
  .list-title { margin: 18px 0 4px; font-size: 21px; font-weight: 800; line-height: 1.4; }
  .list-sub { color: var(--ink-dim); font-size: 14px; margin-bottom: 22px; }
  .list-sub.accent {
    font-weight: 800; font-size: 16px; margin-bottom: 16px;
    background: linear-gradient(120deg, var(--violet-deep), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    display: inline-block;
  }
  .situation-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 16px 16px;
    margin-bottom: 12px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .situation-card:active { transform: scale(0.99); }
  .situation-emoji {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: linear-gradient(135deg, rgba(139,124,246,0.16), rgba(225,143,217,0.16));
  }
  .situation-text { font-size: 15.5px; font-weight: 700; line-height: 1.4; }
  .situation-arrow { margin-left: auto; color: var(--ink-faint); flex-shrink: 0; }

  /* ---------- Detail screen ---------- */
  .said-row { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0 22px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #7ab7f0, var(--violet));
    color: #fff;
  }
  .avatar.you { background: linear-gradient(135deg, var(--violet-deep), var(--violet)); }
  .bubble {
    padding: 13px 17px;
    border-radius: 4px 18px 18px 18px;
    background: #f1edfb;
    font-size: 15px;
    line-height: 1.5;
    max-width: 78%;
    font-weight: 600;
    color: var(--ink);
  }
  .reply-row { display: flex; justify-content: flex-end; align-items: flex-start; gap: 10px; margin-bottom: 26px; }
  .bubble.reply {
    border-radius: 18px 4px 18px 18px;
    background: linear-gradient(120deg, var(--violet-deep), var(--pink));
    color: #fff;
    font-weight: 700;
  }

  .section-label { font-size: 15px; font-weight: 800; margin: 8px 0 14px; }
  .phrase-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .phrase-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .phrase-btn:active { transform: scale(0.99); }
  .phrase-btn .avatar { width: 26px; height: 26px; }
  .phrase-btn .heart {
    margin-left: auto; flex-shrink: 0; width: 18px; height: 18px;
    color: var(--ink-faint);
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .phrase-btn.saved .heart { color: var(--pink); transform: scale(1.15); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(96px + var(--safe-bottom));
    transform: translate(-50%, 12px);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Tips screen ---------- */
  .tip-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    border-radius: 18px;
    padding: 18px 18px 18px 24px;
    margin: 22px 0 0;
  }
  .tip-num {
    position: absolute;
    top: -12px; left: -10px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--violet-deep), var(--pink));
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px -4px rgba(107,91,220,0.6);
  }
  .tip-text { font-size: 15px; line-height: 1.55; font-weight: 700; }

  .crisis-note {
    margin-top: 26px;
    padding: 18px;
    border-radius: 18px;
    background: linear-gradient(120deg, rgba(139,124,246,0.10), rgba(225,143,217,0.12));
    border: 1px solid rgba(139,124,246,0.2);
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-dim);
  }
  .crisis-note b { color: var(--ink); font-size: 15px; }

  /* ---------- Bottom nav ---------- */
  nav.bottombar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 12px 20px calc(14px + var(--safe-bottom));
    display: flex;
    justify-content: space-around;
    background: linear-gradient(0deg, #ffffff 60%, rgba(255,255,255,0));
    backdrop-filter: blur(6px);
  }
  .navbtn {
    background: none; border: none;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 14px;
    transition: color 0.15s ease;
  }
  .navbtn svg { width: 22px; height: 22px; }
  .navbtn.active { color: var(--violet-deep); }
  .navbtn.active svg { color: var(--pink); }

  .dots { display: flex; justify-content: center; gap: 6px; margin: 26px 0 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); opacity: 0.45; }
  .dot.active { width: 18px; border-radius: 4px; background: linear-gradient(90deg, var(--violet), var(--pink)); opacity: 1; }

  ::selection { background: rgba(139,124,246,0.25); }
</style>
</head>

      <button class="btn-primary" id="otherSituationBtn">
        다른 상황의 대화도 볼까요?
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </section>

    <!-- TIPS -->
    <section class="screen" data-screen="tips">
      <p class="list-title">힘들어하는 상대에게<br>어떻게 위로하면 좋을지<br>모르겠다면?</p>
      <p class="list-sub accent">이렇게 해볼까요?</p>
      <div id="tipsList"></div>
      <div class="crisis-note">
        <b>혼자 감당하기 버거운 이야기라면,</b><br>
        전문가와 함께 나눠보는 것도 방법이에요.<br>
        자살예방상담전화 <b>109</b> (24시간, 국번 없이)
      </div>
    </section>

  </main>

  <div class="toast" id="toast">저장했어요</div>

  <nav class="bottombar">
    <button class="navbtn active" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      홈
    </button>
    <button class="navbtn" data-nav="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      대화
    </button>
    <button class="navbtn" data-nav="tips">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5c0-1.5 1.2-2.5 2.5-2.5s2.5 1 2.5 2.3c0 1.4-1.1 1.9-2 2.5-.7.5-1 1-1 1.9"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>
      팁
    </button>
  </nav>

</div>

<script>
(function () {
  var situations = [
    {
      emoji: '😮\u200d💨',
      said: '나 요즘 힘들어',
      primary: '힘들다고 말해도 괜찮아',
      more: ['그런데도 잘 버티고 있네', '너는 혼자가 아니야', '언제든 말해줘', '지금도 충분히 잘하고 있어']
    },
    {
      emoji: '😔',
      said: '나 요즘 다 지쳤어',
      primary: '많이 지쳤겠다, 잠깐 쉬어가도 돼',
      more: ['애쓰고 있는 거 알아', '오늘은 아무것도 안 해도 괜찮아', '옆에 있을게', '천천히 가도 늦지 않아']
    },
    {
      emoji: '😞',
      said: '나 자신이 자꾸 초라하게 느껴져',
      primary: '그런 생각이 들 만큼 힘들었구나',
      more: ['너는 네가 생각하는 것보다 소중해', '그 마음, 그냥 흘려듣지 않을게', '지금 이대로도 괜찮아', '나한테는 네가 참 소중한 사람이야']
    },
    {
      emoji: '😢',
      said: '나 요즘 다 놓아버리고 싶어',
      primary: '그 말, 그냥 넘기지 않고 들을게',
      more: ['무슨 일 있었는지 얘기해줄 수 있어?', '지금 혼자 두지 않을게', '같이 방법을 찾아보자', '네 곁에 내가 있어']
    }
  ];

  var tips = [
    '"힘들어"라는 말에 공감해주기',
    '상대의 감정을 부정하지 않기',
    '지금까지 잘 버텨온 것에 대해 칭찬하기',
    '작은 관심도 큰 힘이 될 수 있다는 것 기억하기',
    '해결책보다 먼저 이야기를 들어주기'
  ];

  var screens = Array.prototype.slice.call(document.querySelectorAll('.screen'));
  var navBtns = Array.prototype.slice.call(document.querySelectorAll('.navbtn'));
  var main = document.getElementById('main');
  var backBtn = document.getElementById('backBtn');
  var toast = document.getElementById('toast');
  var topLogo = document.getElementById('topLogo');

  var history = ['home'];
  var currentSituationIndex = 0;

  function saved() {
    try { var raw = localStorage.getItem('kkeutmal_saved'); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function isSaved(key) { return saved().indexOf(key) !== -1; }
  function toggleSaved(key) {
    try {
      var list = saved(); var i = list.indexOf(key);
      if (i === -1) { list.push(key); } else { list.splice(i, 1); }
      localStorage.setItem('kkeutmal_saved', JSON.stringify(list));
      return i === -1;
    } catch (e) { return true; }
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 1400);
  }

  function renderList() {
    var wrap = document.getElementById('situationList');
    wrap.innerHTML = '';
    situations.forEach(function (s, idx) {
      var btn = document.createElement('button');
      btn.className = 'situation-card';
      btn.innerHTML =
        '<span class="situation-emoji">' + s.emoji + '</span>' +
        '<span class="situation-text">' + s.said + '</span>' +
        '<svg class="situation-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
      btn.addEventListener('click', function () {
        currentSituationIndex = idx;
        renderDetail(idx);
        go('detail');
      });
      wrap.appendChild(btn);
    });
  }

  function renderDetail(idx) {
    var s = situations[idx];
    document.getElementById('saidText').textContent = s.said;
    document.getElementById('primaryReply').textContent = s.primary;
    var moreWrap = document.getElementById('moreList');
    moreWrap.innerHTML = '';
    s.more.forEach(function (phrase, i) {
      var key = idx + '-' + i;
      var btn = document.createElement('button');
      btn.className = 'phrase-btn' + (isSaved(key) ? ' saved' : '');
      btn.innerHTML =
        '<span class="avatar you" style="width:26px;height:26px;">' +
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>' +
        '</span>' +
        '<span>' + phrase + '</span>' +
        '<svg class="heart" viewBox="0 0 24 24" fill="' + (isSaved(key) ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9C1 8.3 2.6 5 6 5c2 0 3.3 1 4.9 3C12.7 6 14 5 16 5c3.4 0 5 3.3 3.5 7-2.5 4.4-9.5 9-9.5 9z"/></svg>';
      btn.addEventListener('click', function () {
        var nowSaved = toggleSaved(key);
        btn.classList.toggle('saved', nowSaved);
        btn.querySelector('.heart').setAttribute('fill', nowSaved ? 'currentColor' : 'none');
        showToast(nowSaved ? '저장했어요' : '저장을 취소했어요');
      });
      moreWrap.appendChild(btn);
    });
  }

  function renderTips() {
    var wrap = document.getElementById('tipsList');
    wrap.innerHTML = '';
    tips.forEach(function (t, i) {
      var card = document.createElement('div');
      card.className = 'tip-card';
      card.innerHTML = '<span class="tip-num">' + (i + 1) + '</span><span class="tip-text">' + t + '</span>';
      wrap.appendChild(card);
    });
  }

  function go(name, opts) {
    opts = opts || {};
    screens.forEach(function (sc) { sc.classList.toggle('active', sc.dataset.screen === name); });
    navBtns.forEach(function (b) {
      b.classList.toggle('active', b.dataset.nav === name || (name === 'detail' && b.dataset.nav === 'list'));
    });
    backBtn.classList.toggle('ghost', name === 'home');
    topLogo.classList.toggle('hidden', name === 'home');
    main.scrollTop = 0;
    if (!opts.skipHistory) { if (history[history.length - 1] !== name) history.push(name); }
  }

  document.getElementById('startBtn').addEventListener('click', function () { renderList(); go('list'); });
  document.getElementById('otherSituationBtn').addEventListener('click', function () { renderList(); go('list'); });

  navBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var target = b.dataset.nav;
      if (target === 'list') renderList();
      if (target === 'tips') renderTips();
      go(target);
    });
  });

  backBtn.addEventListener('click', function () {
    if (history.length > 1) {
      history.pop();
      var prev = history[history.length - 1];
      if (prev === 'list') renderList();
      if (prev === 'tips') renderTips();
      if (prev === 'detail') renderDetail(currentSituationIndex);
      go(prev, { skipHistory: true });
    } else { go('home', { skipHistory: true }); }
  });

  renderList();
  renderTips();
})();
</script>
</body>
</html>
